name: Code Quality

on:
  push:
    branches: [ main, master, develop, claude/** ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  lint-and-format:
    name: Lint and Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black isort

      - name: Run Ruff (linter)
        continue-on-error: true
        run: |
          echo "## Ruff Linting Results" >> $GITHUB_STEP_SUMMARY
          ruff check . --output-format=github || echo "⚠️ Ruff found issues" >> $GITHUB_STEP_SUMMARY

      - name: Check code formatting with Black
        continue-on-error: true
        run: |
          echo "## Black Formatting Check" >> $GITHUB_STEP_SUMMARY
          black --check --diff . || echo "⚠️ Code needs formatting" >> $GITHUB_STEP_SUMMARY

      - name: Check import sorting with isort
        continue-on-error: true
        run: |
          echo "## isort Import Sorting Check" >> $GITHUB_STEP_SUMMARY
          isort --check-only --diff . || echo "⚠️ Imports need sorting" >> $GITHUB_STEP_SUMMARY

  type-check:
    name: Type Check with mypy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install mypy types-setuptools

      - name: Run mypy
        continue-on-error: true
        run: |
          echo "## mypy Type Checking Results" >> $GITHUB_STEP_SUMMARY
          mypy molvis_core --ignore-missing-imports --no-strict-optional || echo "⚠️ Type checking found issues" >> $GITHUB_STEP_SUMMARY

  code-complexity:
    name: Code Complexity Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install radon

      - name: Analyze code complexity
        run: |
          echo "## Code Complexity Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Cyclomatic Complexity" >> $GITHUB_STEP_SUMMARY
          radon cc molvis_core -a -s || true
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Maintainability Index" >> $GITHUB_STEP_SUMMARY
          radon mi molvis_core -s || true

  quality-summary:
    name: Quality Summary
    runs-on: ubuntu-latest
    needs: [lint-and-format, type-check, code-complexity]
    if: always()

    steps:
      - name: Summary
        run: |
          echo "## Code Quality Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Linting: ${{ needs.lint-and-format.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Type Checking: ${{ needs.type-check.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Complexity: ${{ needs.code-complexity.result }}" >> $GITHUB_STEP_SUMMARY
