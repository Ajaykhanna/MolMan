name: Performance Testing

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for comparison

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-benchmark

      - name: Run performance benchmarks
        run: |
          # Run tests marked with @pytest.mark.performance
          pytest -v -m performance --benchmark-only --benchmark-json=benchmark.json || true

      - name: Store benchmark result
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'pytest'
          output-file-path: benchmark.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          # Show alert with commit comment on detecting possible performance regression
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: false

      - name: Compare with baseline
        if: github.event_name == 'pull_request'
        run: |
          echo "## Performance Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f benchmark.json ]; then
            echo "✓ Benchmarks completed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "See artifacts for detailed results" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No benchmark results found" >> $GITHUB_STEP_SUMMARY
            echo "Add @pytest.mark.performance to tests for benchmarking" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: benchmark.json
          retention-days: 30

  load-test:
    name: Load Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest memory-profiler

      - name: Memory profiling tests
        run: |
          echo "## Memory Usage Analysis" >> $GITHUB_STEP_SUMMARY
          # Run memory profiling on key operations
          python -c "
          from molvis_core import io as core_io
          from pathlib import Path
          import tracemalloc

          tracemalloc.start()

          # Load test file if available
          test_files = list(Path('.').glob('*.xyz'))
          if test_files:
              symbols, coords = core_io.load_xyz(test_files[0])
              current, peak = tracemalloc.get_traced_memory()
              print(f'Memory usage: {current / 1024 / 1024:.2f} MB')
              print(f'Peak memory: {peak / 1024 / 1024:.2f} MB')

          tracemalloc.stop()
          " || true
          echo "✓ Memory profiling completed" >> $GITHUB_STEP_SUMMARY

  performance-summary:
    name: Performance Summary
    runs-on: ubuntu-latest
    needs: [benchmark, load-test]
    if: always()

    steps:
      - name: Summary
        run: |
          echo "## Performance Testing Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Benchmarks: ${{ needs.benchmark.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Load Testing: ${{ needs.load-test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ needs.benchmark.result }}" == "success" ]] && [[ "${{ needs.load-test.result }}" == "success" ]]; then
            echo "✅ All performance tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Some performance tests need attention" >> $GITHUB_STEP_SUMMARY
          fi
