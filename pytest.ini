[pytest]
# Pytest configuration for MolMan

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=molvis_core
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-branch

# Coverage options
[coverage:run]
source = molvis_core
omit =
    */tests/*
    */test_*.py
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

# Markers for categorizing tests
markers =
    unit: Unit tests for individual functions/classes
    integration: Integration tests across modules
    slow: Tests that take significant time to run
    io: File I/O related tests
    geometry: Geometry and transformation tests
    visualization: Visualization-related tests
